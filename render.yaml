# Render Blueprint: New → Blueprint → connect repo (see https://render.com/docs/blueprint-spec)
#
# Optional: set backend CORS_ORIGINS to your static site URL for stricter CORS.

databases: []

services:
  - type: web
    name: chirunners-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 run:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: '3.12.6'
      - key: MAPBOX_ACCESS_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: chirunners-web
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: chirunners-api
          envVarKey: RENDER_EXTERNAL_URL
