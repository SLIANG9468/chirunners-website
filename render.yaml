# Render Blueprint: New → Blueprint → connect repo (see https://render.com/docs/blueprint-spec)
# Plans are selected in the Render UI when applying the Blueprint (omit `plan` here).
#
# Optional: set backend CORS_ORIGINS to your static site URL for stricter CORS.
#
# Production Postgres is chirunners-website-db (set DATABASE_URL manually on chirunners-api).
# Do not add a databases: block here — Blueprint would wire the API to the wrong instance.
#
# Chi check-in data lives in Postgres (city / visit tables).

services:
  - type: web
    name: chirunners-api
    runtime: python
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Let Render's Python runtime set bind via GUNICORN_CMD_ARGS (see env below).
    # Do not pass --bind/--workers here; duplicate flags conflict with Render defaults.
    startCommand: gunicorn --timeout 120 run:app
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_APP
        value: run:app
      # Render defaults include --preload, which is unsafe with threading locks after fork.
      - key: GUNICORN_CMD_ARGS
        value: '--access-logfile - --bind=0.0.0.0:10000'
      # Set in Render dashboard from chirunners-website-db → Connect → Internal Database URL.
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: '3.12.8'
      - key: SMUGMUG_NICKNAME
        sync: false
      - key: SMUGMUG_GALLERY_PATH_CHI
        sync: false
      - key: SMUGMUG_IMAGE_URL_CACHE_SECONDS
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: chirunners-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: chirunners-api
          envVarKey: RENDER_EXTERNAL_URL
